directory: ~/Library/CloudStorage/ProtonDrive-oliver.hofkens@proton.me-folder/Music
library: ~/Library/CloudStorage/ProtonDrive-oliver.hofkens@proton.me-folder/Music/beets-library.db
plugins:
  - musicbrainz
  - fromfilename
  - info
  - edit
  - fetchart
  - embedart
  - lyrics
  - convert

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: $artist/Non-Album/$title

import:
  copy: yes

fetchart:
  auto: true
  cautious: yes

embedart:
  auto: yes
  ifempty: yes

lyrics:
  auto: yes
  sources: "*"

convert:
  dest: ~/Library/CloudStorage/ProtonDrive-oliver.hofkens@proton.me-folder/FlacArchive/Music
  format: opus
  never_convert_lossy_files: yes
  formats:
    opus:
      command: ffmpeg -i $source -y -vn -acodec libopus -ab 160k $dest
      extension: opus
